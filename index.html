<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ms Van's English Class - AI Assistant & Teaching Toolkit</title>
    <meta name="description" content="AI-Powered toolkit for English language teachers: Lesson Planner, Quiz & Worksheet Builder, Essay Grader, and Vocabulary Flashcards." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ms Van English" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Instant Zero-Latency Pre-Boot Splash Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020617;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        z-index: 9999;
        user-select: none;
      }
      .pre-splash-icon-wrap {
        position: relative;
        margin-bottom: 24px;
      }
      .pre-splash-icon {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4), 0 8px 10px -6px rgba(79, 70, 229, 0.2);
      }
      .pre-splash-icon svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pre-splash-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin: 0 0 6px 0;
      }
      .pre-splash-subtitle {
        font-size: 13px;
        color: #a5b4fc;
        margin: 0 0 28px 0;
        font-weight: 500;
      }
      .pre-splash-loader {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
      }
      .pre-splash-loader-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #4f46e5, #c084fc, #ec4899);
        border-radius: 9999px;
        animation: pre-loader-anim 1.5s ease-in-out infinite;
      }
      @keyframes pre-loader-anim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Zero-Latency Pre-Boot Shell (rendered immediately at Frame 0) -->
      <div class="pre-splash">
        <div class="pre-splash-icon-wrap">
          <div class="pre-splash-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h10"></path>
            </svg>
          </div>
        </div>
        <h1 class="pre-splash-title">Ms Van English</h1>
        <p class="pre-splash-subtitle">Interactive AI Learning &amp; Teaching Hub</p>
        <div class="pre-splash-loader">
          <div class="pre-splash-loader-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
