    <!-- Instant Zero-Latency Unified Splash Screen (Native App Grade) -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020617;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        z-index: 99999;
        user-select: none;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 1;
        transform: scale(1);
      }
      #app-splash.splash-fade-out {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .app-splash-icon-wrap {
        position: relative;
        margin-bottom: 22px;
      }
      .app-splash-icon {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 28px -5px rgba(79, 70, 229, 0.45), 0 8px 10px -6px rgba(79, 70, 229, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .app-splash-icon svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app-splash-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin: 0 0 6px 0;
      }
      .app-splash-subtitle {
        font-size: 13px;
        color: #a5b4fc;
        margin: 0 0 28px 0;
        font-weight: 500;
      }
      .app-splash-loader {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        overflow: hidden;
      }
      .app-splash-loader-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #4f46e5, #c084fc, #ec4899);
        border-radius: 9999px;
        animation: splash-loader-anim 1.4s ease-in-out infinite;
      }
      @keyframes splash-loader-anim {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
