<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="book-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.75" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#pwa-grad)" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="180" r="140" fill="#ffffff" opacity="0.15" filter="blur(20px)" />

  <!-- Book Icon & Sparkles -->
  <g transform="translate(106, 116)" filter="url(#drop-shadow)">
    <!-- Book Left Page -->
    <path d="M150 240 C90 220, 30 230, 10 245 L10 60 C30 45, 90 35, 150 55 Z" fill="url(#book-shadow)" />
    <!-- Book Right Page -->
    <path d="M150 240 C210 220, 270 230, 290 245 L290 60 C270 45, 210 35, 150 55 Z" fill="#ffffff" />
    <!-- Book Spine -->
    <path d="M150 55 L150 240" stroke="#818cf8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Text lines on left page -->
    <line x1="40" y1="95" x2="120" y2="95" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="40" y1="125" x2="120" y2="125" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="40" y1="155" x2="100" y2="155" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Text lines on right page -->
    <line x1="180" y1="95" x2="260" y2="95" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="180" y1="125" x2="260" y2="125" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="180" y1="155" x2="240" y2="155" stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Floating Sparkle Stars -->
    <path d="M150 0 L155 20 L175 25 L155 30 L150 50 L145 30 L125 25 L145 20 Z" fill="#fef08a" />
    <path d="M280 20 L283 32 L295 35 L283 38 L280 50 L277 38 L265 35 L277 32 Z" fill="#fef08a" opacity="0.9" />
  </g>
</svg>
